# BurakOyun — Android Gradle Properties
# Bu dosya [CXX1429] CMake/NDK prefab hatasını önler.
# Unity 6 + IL2CPP + ARM64 kombinasyonu için test edilmiş ayarlar.
#
# Aktif etmek için:
#   Project Settings → Player → Android → Publishing Settings
#   → Custom Gradle Properties Template kutucuğunu işaretle

org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# NDK r25c — Unity 6 IL2CPP ARM64 ile uyumlu, CXX1429 hatasını önler.
# Unity Hub → Installs → Android Build Support → NDK r25c yüklü olmalı.
# VEYA Edit → Preferences → External Tools → Android NDK'yı "Installed with Unity" yap.
android.ndkVersion=25.1.8937393

# Prefab plugin — CMakeLists.txt [prefab] hatasını önler
android.prefabVersion=2.0.0

# Build özellikleri
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
